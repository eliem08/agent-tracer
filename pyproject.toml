[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tracer"
version = "0.1.0"
description = "See every step your agents took, what it cost and where it broke."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "eliem08" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Private :: Do Not Upload",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
agent-tracer = "agent_tracer.__main__:main"
agent-tracer-web = "agent_tracer.web:main"

[project.urls]
Repository = "https://github.com/eliem08/agent-tracer"

[tool.setuptools]
packages = ["agent_tracer"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "RUF"]
ignore = ["E501", "E741", "SIM108", "RUF001", "RUF002", "RUF003", "RUF022", "B905"]  # E501: ruff format owns line length

[tool.ruff.lint.per-file-ignores]
"agent_tracer/__init__.py" = ["F401", "F403"]
"tests/*" = ["E501"]
