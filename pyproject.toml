[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tracer"
version = "0.1.0"
description = "Datadog for agents: see every step your agents took"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-tracer = "agent_tracer.__main__:main"

[tool.setuptools]
packages = ["agent_tracer"]
